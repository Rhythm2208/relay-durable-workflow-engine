services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5434:5432"
    volumes:
      - relay-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 20
  relay:
    build: .
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/relay
      SPRING_DATASOURCE_USERNAME: relay
      SPRING_DATASOURCE_PASSWORD: relay
      RELAY_WORKERS: 4
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  relay-data:
